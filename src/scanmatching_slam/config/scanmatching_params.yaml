scanmatching_slam:
  ros__parameters:
    registration_method: "NDT"
    ndt_resolution: 5.0
    ndt_num_threads: 0
    gicp_corr_dist: 1.0
    trans_for_mapupdate: 0.3
    vg_size_for_input: 0.05
    vg_size_for_map: 0.05
    scan_min_range: 0.5
    scan_max_range: 4.0
    num_targeted_cloud: 20
    map_publish_period: 5.0
    use_odom: true
    publish_tf: true
    global_frame_id: "map"
    robot_frame_id: "base_link"
    odom_frame_id: "odom"
    input_cloud_topic: "/full_pointcloud"
    odom_topic: "/odom"
