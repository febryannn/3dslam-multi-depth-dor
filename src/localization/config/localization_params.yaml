###############################################
# Parameter Localization Node - Lokalisasi dengan Pre-built Map
###############################################
rgbd_cam_loc:
  ros__parameters:
    # === Map File ===
    pcd_path: "/tmp/slam_map.pcd"     # Path ke PCD file hasil SLAM

    # === Frames ===
    global_frame_id: "map"
    robot_frame_id: "base_link"
    odom_frame_id: "odom"

    # === Registration ===
    registration_method: "GICP"       # "GICP" atau "NDT"
    ndt_resolution: 5.0
    gicp_max_corr_dist: 1.5           # Lebih besar dari SLAM karena initial guess bisa kurang akurat
    gicp_max_iterations: 50
    gicp_fitness_threshold: 1.0       # Lebih toleran untuk lokalisasi

    # === Filtering ===
    voxel_leaf_size: 0.06
    map_voxel_leaf_size: 0.1
    use_min_max_filter: true
    scan_min_range: 0.8               # Kinect V1 minimum
    scan_max_range: 4.5               # Kinect V1 maximum

    # === Update Rate ===
    loc_update_min_dist: 0.1          # Update lokalisasi hanya jika robot bergerak > 0.1m

    # === TF ===
    publish_tf: true

    # === Input ===
    input_cloud_topic: "/full_pointcloud"

    # === Debug ===
    debug_flag: false
