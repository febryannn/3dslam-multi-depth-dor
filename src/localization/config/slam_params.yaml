###############################################
# Parameter SLAM Node - 3D SLAM Multi-Depth Camera
###############################################
slam_rgbd_cam:
  ros__parameters:
    # === Jarak Kamera ===
    max_cam_d: 8.0          # Jarak maksimum depth camera (meter)
    min_cam_d: 0.5          # Jarak minimum depth camera (meter)

    # === Filtering ===
    voxel_leaf_size: 0.06    # Resolusi voxel untuk scan saat ini (meter)
    map_voxel_leaf_size: 0.08 # Resolusi voxel untuk map (meter)
    crop_min_z: -0.3         # Batas bawah Z (tangkap lantai)
    crop_max_z: 2.5          # Batas atas Z
    self_filter_size: 0.6    # Ukuran self-filter (hapus titik robot sendiri)
    sor_mean_k: 30           # Statistical Outlier Removal - jumlah tetangga
    sor_stddev: 1.0          # Statistical Outlier Removal - threshold std dev

    # === Scan Matching ===
    use_ndt: false           # true = NDT, false = GICP
    gicp_max_corr_dist: 1.0  # Jarak korespondensi maksimum GICP (meter)
    gicp_max_iterations: 50  # Iterasi maksimum GICP
    gicp_transform_epsilon: 1.0e-6  # Epsilon konvergensi transformasi
    gicp_fitness_threshold: 0.5     # Threshold fitness score (tolak jika lebih tinggi)
    ndt_step_size: 0.1       # NDT step size
    ndt_resolution: 1.0      # NDT grid resolution

    # === OctoMap ===
    octomap_resolution: 0.1  # Resolusi OctoMap (meter)
    publish_octomap_cloud: true  # Publish OctoMap sebagai point cloud

    # === Keyframe Management ===
    keyframe_dist_threshold: 0.3   # Jarak minimal untuk keyframe baru (meter)
    keyframe_angle_threshold: 0.2  # Sudut minimal untuk keyframe baru (radian, ~11.5 deg)
    local_map_size: 20             # Jumlah keyframe dalam local map (sliding window)

    # === Map Saving ===
    map_save_path: "/tmp/slam_map"  # Path dasar untuk save map (.pcd, .bt, _trajectory.txt)

    # === Sensor ===
    sensor_height: 0.4       # Tinggi sensor dari base_link (meter)

    # === Posisi Kamera Relatif ke base_link ===
    cam1_x: 0.4     # Depan
    cam1_y: 0.0
    cam1_yaw: 0.0
    cam2_x: -0.4    # Belakang
    cam2_y: 0.0
    cam2_yaw: 3.14159
    cam3_x: 0.0     # Kiri
    cam3_y: 0.25
    cam3_yaw: 1.5708
    cam4_x: 0.0     # Kanan
    cam4_y: -0.25
    cam4_yaw: -1.5708
